        letter-spacing: 0.08em;
        margin-top: 9px;
      }
      .pwa-splash-loader {
        background: rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        height: 4px;
        margin-top: 28px;
        overflow: hidden;
        position: relative;
        width: 132px;
      }
      .pwa-splash-loader::before {
        animation: pwa-splash-loader-beacon 900ms ease-in-out infinite;
        background: var(--pwa-splash-accent);
        border-radius: inherit;
        content: "";
        height: 8px;
        left: 0;
        position: absolute;
        top: -2px;
        width: 8px;
        z-index: 1;
      }
      .pwa-splash-loader::after {
        animation: pwa-splash-progress 900ms ease-in-out infinite;
        background: #fff;
        border-radius: inherit;
        content: "";
        display: block;
        height: 100%;
        transform: translateX(-65%);
        width: 65%;
      }
      #pwa-startup-splash[data-progress-known="true"] .pwa-splash-progress {
        display: block;
      }
      #pwa-startup-splash[data-progress-known="true"] .pwa-splash-loader::before {
        animation: none;
        left: var(--pwa-splash-progress);
        transform: translateX(-50%);
      }
      #pwa-startup-splash[data-progress-known="true"] .pwa-splash-loader::after {
        animation: none;
        transform: none;
        width: var(--pwa-splash-progress);
      }
      #pwa-startup-splash[data-season="autumn"] { --pwa-splash-accent: #fde68a; }

      @keyframes pwa-root-reveal {

      @media (prefers-reduced-motion: reduce) {

        .pwa-splash-loader::after { animation: none; transform: translateX(54%); }
